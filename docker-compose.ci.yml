# CI-specific docker-compose for running tests with services
# Usage: docker compose -f docker-compose.ci.yml up --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres-ci
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos123
      POSTGRES_DB: pos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pos-pgdata-ci:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos-backend-ci
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pos:pos123@postgres:5432/pos?schema=public
      PORT: 4000
      WEB_ORIGIN: http://localhost:3020,https://shohojhisab.com,https://mobile.shohojhisab.com
      ALLOW_PLATFORM_BOOTSTRAP: 1
      PLATFORM_BOOTSTRAP_TOKEN: ${PLATFORM_BOOTSTRAP_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: test
    ports:
      - "4000:4000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pos-frontend-ci
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_APP_ENV: production
      NEXT_PUBLIC_API_URL: https://server.shohojhisab.com
    ports:
      - "3020:3020"
    depends_on:
      - backend

volumes:
  pos-pgdata-ci:
