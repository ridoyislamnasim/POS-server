name: Backend CI/CD

on:
  push:
    branches: [main, develop]

  pull_request:
    branches: [main, develop]

  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

      force_rollback:
        description: "Rollback to the previous application version"
        required: false
        default: false
        type: boolean

  release:
    types: [published]

concurrency:
  group: backend-cicd-${{ github.ref }}-${{ github.event_name }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  # ============================================================
  # Resolve environment
  # ============================================================
  resolve-env:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      web_origin: ${{ steps.resolve.outputs.web_origin }}

    steps:
      - name: Resolve environment
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENVIRONMENT="$INPUT_ENVIRONMENT"
          elif [ "$EVENT_NAME" = "release" ]; then
            ENVIRONMENT="production"
          elif [ "$REF" = "refs/heads/main" ]; then
            ENVIRONMENT="production"
          elif [ "$REF" = "refs/heads/develop" ]; then
            ENVIRONMENT="staging"
          else
            ENVIRONMENT="staging"
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

          if [ "$ENVIRONMENT" = "production" ]; then
            echo "web_origin=http://localhost:3020,https://shohojhisab.com,https://mobile.shohojhisab.com" >> "$GITHUB_OUTPUT"
          else
            echo "web_origin=http://localhost:3020" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved environment: $ENVIRONMENT"

  # ============================================================
  # Test
  # ============================================================
  test:
    needs: resolve-env
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos123
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Prisma validate
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Prisma migrate
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public
          WEB_ORIGIN: ${{ needs.resolve-env.outputs.web_origin }}
          ALLOW_PLATFORM_BOOTSTRAP: "1"
          PLATFORM_BOOTSTRAP_TOKEN: ${{ secrets.PLATFORM_BOOTSTRAP_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          NODE_ENV: test

  # ============================================================
  # Lint
  # ============================================================
  lint:
    needs: resolve-env
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  # ============================================================
  # Build
  # ============================================================
  build:
    needs: [resolve-env, test, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create build metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/generated

          cat > src/generated/build-info.ts <<EOF
          export const BUILD_SHA = "${GITHUB_SHA}";
          export const BUILD_TIME = "$(date -u +%FT%TZ)";
          EOF

          cat src/generated/build-info.ts

      - name: Build
        run: pnpm build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: |
            dist/
            prisma/
            prisma.config.ts
            .npmrc
            package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 14

  # ============================================================
  # Deploy
  #
  # IMPORTANT:
  # workflow_dispatch + force_rollback=true
  # will NOT deploy.
  # ============================================================
  deploy:
    needs: [resolve-env, build]
    runs-on: ubuntu-latest

    if: >
      github.event_name != 'pull_request' &&
      !(
        github.event_name == 'workflow_dispatch' &&
        inputs.force_rollback == true
      ) &&
      (
        github.ref == 'refs/heads/main' ||
        github.ref == 'refs/heads/develop' ||
        github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch'
      )

    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      # ----------------------------------------------------------
      # Download artifact
      # ----------------------------------------------------------
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ github.sha }}
          path: artifact

      # ----------------------------------------------------------
      # SSH
      # ----------------------------------------------------------
      - name: Configure SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DO_HOST" || {
            echo "::error::DO_HOST is not configured"
            exit 1
          }

          test -n "$DO_USER" || {
            echo "::error::DO_USER is not configured"
            exit 1
          }

          test -n "$DO_SSH_KEY" || {
            echo "::error::DO_SSH_KEY is not configured"
            exit 1
          }

          mkdir -p ~/.ssh

          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # ----------------------------------------------------------
      # Backup current application
      # ----------------------------------------------------------
      - name: Backup current application
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/digitalocean \
            "$DO_USER@$DO_HOST" '
              set -euo pipefail

              cd ~/pos/POS-server

              if [ -d dist ]; then
                TS="$(date -u +%Y%m%d-%H%M%S)"

                mv dist "dist.backup-$TS"

                echo "Created backup: dist.backup-$TS"

                ls -dt dist.backup-* 2>/dev/null |
                  tail -n +4 |
                  xargs -r rm -rf
              fi

              mkdir -p dist
            '

      # ----------------------------------------------------------
      # Upload artifact
      # ----------------------------------------------------------
      - name: Upload application artifact
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/digitalocean \
            "$DO_USER@$DO_HOST" \
            "mkdir -p ~/pos/POS-server"

          rsync -az --delete \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.git \
            -e "ssh -i ~/.ssh/digitalocean" \
            artifact/dist/ \
            "$DO_USER@$DO_HOST:~/pos/POS-server/dist/"

          scp -i ~/.ssh/digitalocean \
            artifact/package.json \
            artifact/pnpm-lock.yaml \
            "$DO_USER@$DO_HOST:~/pos/POS-server/"

          # Prisma config and pnpm config required for correct generate/linking (persistence across deploys)
          scp -i ~/.ssh/digitalocean \
            artifact/prisma.config.ts \
            "$DO_USER@$DO_HOST:~/pos/POS-server/" 2>/dev/null || echo "prisma.config.ts not in artifact (optional)"

          scp -i ~/.ssh/digitalocean \
            artifact/.npmrc \
            "$DO_USER@$DO_HOST:~/pos/POS-server/" 2>/dev/null || echo ".npmrc not in artifact (optional)"

          scp -r -i ~/.ssh/digitalocean \
            artifact/prisma \
            "$DO_USER@$DO_HOST:~/pos/POS-server/"

      # ----------------------------------------------------------
      # Server deployment
      # ----------------------------------------------------------
      - name: Install dependencies, migrate DB and restart
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/digitalocean \
            "$DO_USER@$DO_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="$HOME/pos/POS-server"

          cd "$APP_DIR"

          echo "=========================================="
          echo "ShohojHisab Backend Deployment"
          echo "=========================================="

          echo "Deploy directory: $APP_DIR"
          echo "Expected SHA: $EXPECTED_SHA"

          # ------------------------------------------------------
          # Load environment
          # ------------------------------------------------------

          if [ ! -f .env ]; then
            echo "::error::.env file not found"
            exit 1
          fi

          set -a
          . ./.env
          set +a

          # ------------------------------------------------------
          # Ensure pnpm
          # ------------------------------------------------------

          corepack enable
          corepack prepare pnpm@9.15.9 --activate

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          # ------------------------------------------------------
          # Install dependencies
          # ------------------------------------------------------

          echo "Installing dependencies..."

          pnpm install --frozen-lockfile

          # ------------------------------------------------------
          # Prisma checks
          # ------------------------------------------------------

          echo "Checking Prisma CLI..."

          test -x ./node_modules/.bin/prisma || {
            echo "::error::Prisma CLI is not installed"
            exit 1
          }

          echo "Prisma CLI:"
          ./node_modules/.bin/prisma --version

          test -d prisma || {
            echo "::error::prisma directory missing"
            exit 1
          }

          test -d prisma/schema || {
            echo "::error::prisma/schema directory missing"
            exit 1
          }

          echo "Validating Prisma schema..."

          ./node_modules/.bin/prisma validate

          # ------------------------------------------------------
          # Always regenerate Prisma Client
          # ------------------------------------------------------

          echo "Regenerating Prisma Client..."

          echo "Regenerating Prisma Client..."

          ./node_modules/.bin/prisma generate

          echo "Verifying generated Prisma Client..."

          node --input-type=module <<'NODE'
          import { PrismaClient } from "@prisma/client";

          const prisma = new PrismaClient();

          try {
              await prisma.$disconnect();
              console.log("Prisma Client runtime import: OK");
          } catch (error) {
              console.error("Prisma Client runtime verification failed:");
              console.error(error);
              process.exit(1);
          }
          NODE

          echo "Prisma Client generated and verified successfully."
          # ------------------------------------------------------
          # Database migrations
          #
          # NO migration name is hardcoded.
          # Prisma automatically applies every pending migration.
          # ------------------------------------------------------

          echo "Running database migrations..."

          ./node_modules/.bin/prisma migrate deploy

          echo "Checking migration status..."

          ./node_modules/.bin/prisma migrate status

          # ------------------------------------------------------
          # Database + Prisma runtime smoke test
          # ------------------------------------------------------

          echo "Testing database and Prisma runtime..."

          node --input-type=module <<'NODE'
          import { PrismaClient } from "@prisma/client";

          const prisma = new PrismaClient();

          try {
            await prisma.$queryRaw`SELECT 1`;

            console.log("Database connection: OK");

            const result = await prisma.$queryRaw`
              SELECT current_database() AS database
            `;

            console.log("Database:", result[0]?.database ?? "unknown");
          } finally {
            await prisma.$disconnect();
          }
          NODE

          # ------------------------------------------------------
          # PM2
          # ------------------------------------------------------

          echo "Checking PM2..."

          if pm2 describe backend >/dev/null 2>&1; then
            echo "Existing PM2 process found."

            pm2 restart backend --update-env
          else
            echo "PM2 process does not exist. Starting backend..."

            pm2 start dist/index.js \
              --name backend \
              --cwd "$APP_DIR" \
              --update-env
          fi

          pm2 save

          # ------------------------------------------------------
          # Verify PM2 configuration
          # ------------------------------------------------------

          echo "Verifying PM2 process..."

          PM2_DATA="$(
            pm2 jlist |
            node --input-type=module <<'NODE'
          let input = "";

          process.stdin.on("data", chunk => {
            input += chunk;
          });

          process.stdin.on("end", () => {
            const processes = JSON.parse(input);
            const app = processes.find(p => p.name === "backend");

            if (!app) {
              console.error("PM2 backend process not found");
              process.exit(1);
            }

            console.log(JSON.stringify({
              cwd: app.pm2_env?.pm_cwd || "",
              script: app.pm2_env?.pm_exec_path || "",
              status: app.pm2_env?.status || ""
            }));
          });
          NODE
          )"

          echo "PM2 data: $PM2_DATA"

          PM2_CWD="$(echo "$PM2_DATA" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>console.log(JSON.parse(s).cwd));
          ')"

          PM2_SCRIPT="$(echo "$PM2_DATA" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>console.log(JSON.parse(s).script));
          ')"

          PM2_STATUS="$(echo "$PM2_DATA" | node -e '
            let s="";
            process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=>console.log(JSON.parse(s).status));
          ')"

          echo "PM2 cwd: $PM2_CWD"
          echo "PM2 script: $PM2_SCRIPT"
          echo "PM2 status: $PM2_STATUS"

          if [ "$PM2_CWD" != "$APP_DIR" ]; then
            echo "::error::PM2 cwd is incorrect: $PM2_CWD"
            exit 1
          fi

          if [ "$PM2_SCRIPT" != "$APP_DIR/dist/index.js" ]; then
            echo "::error::PM2 script is incorrect: $PM2_SCRIPT"
            exit 1
          fi

          if [ "$PM2_STATUS" != "online" ]; then
            echo "::error::PM2 backend is not online"
            exit 1
          fi

          echo "PM2 configuration: OK"

          REMOTE_SCRIPT

      # ----------------------------------------------------------
      # Verify actual live application
      # ----------------------------------------------------------
      - name: Verify live application
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/digitalocean \
            "$DO_USER@$DO_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          APP_DIR="$HOME/pos/POS-server"

          cd "$APP_DIR"

          set -a
          . ./.env
          set +a

          PORT_VALUE="${PORT:-4000}"

          echo "Application port: $PORT_VALUE"

          # ------------------------------------------------------
          # Wait for application
          # ------------------------------------------------------

          for i in $(seq 1 20); do

            if curl -fsS \
              --max-time 5 \
              "http://127.0.0.1:$PORT_VALUE/api/health" \
              >/tmp/health.json 2>/dev/null
            then
              echo "Application is responding."
              break
            fi

            if [ "$i" = "20" ]; then
              echo "::error::Application did not become healthy"
              pm2 logs backend --lines 100 --nostream || true
              exit 1
            fi

            sleep 2
          done

          # ------------------------------------------------------
          # Health
          # ------------------------------------------------------

          HEALTH_HTTP="$(
            curl -sS \
              --max-time 10 \
              -o /tmp/health.json \
              -w '%{http_code}' \
              "http://127.0.0.1:$PORT_VALUE/api/health"
          )"

          cat /tmp/health.json || true

          if [ "$HEALTH_HTTP" != "200" ]; then
            echo "::error::/api/health returned $HEALTH_HTTP"
            exit 1
          fi

          echo "/api/health: OK"

          # ------------------------------------------------------
          # Version
          # ------------------------------------------------------

          VERSION_RESPONSE="$(
            curl -fsS \
              --max-time 10 \
              "http://127.0.0.1:$PORT_VALUE/api/version"
          )"

          echo "Version response:"
          echo "$VERSION_RESPONSE"

          LIVE_SHA="$(
            printf '%s' "$VERSION_RESPONSE" |
            grep -o '"version":"[^"]*"' |
            cut -d'"' -f4
          )"

          if [ "$LIVE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Live version mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $LIVE_SHA"
            exit 1
          fi

          echo "Live version: OK"

          # ------------------------------------------------------
          # Readiness
          # ------------------------------------------------------

          READY_HTTP="$(
            curl -sS \
              --max-time 10 \
              -o /tmp/ready.json \
              -w '%{http_code}' \
              "http://127.0.0.1:$PORT_VALUE/api/ready" \
              || true
          )"

          cat /tmp/ready.json || true

          if [ "$READY_HTTP" != "200" ]; then
            echo "::error::/api/ready returned $READY_HTTP"
            echo "Production/staging deployment is not considered successful."
            exit 1
          fi

          echo "/api/ready: OK"

          echo "=========================================="
          echo "LIVE APPLICATION VERIFIED"
          echo "SHA: $EXPECTED_SHA"
          echo "=========================================="

          REMOTE_SCRIPT

      # ----------------------------------------------------------
      # External verification
      # ----------------------------------------------------------
      - name: Verify public API
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$BACKEND_URL" || {
            echo "::error::BACKEND_URL is not configured"
            exit 1
          }

          for i in $(seq 1 20); do

            if curl -fsS \
              --max-time 10 \
              "$BACKEND_URL/api/health" \
              >/tmp/public-health.json
            then
              echo "Public /api/health: OK"
              break
            fi

            if [ "$i" = "20" ]; then
              echo "::error::Public backend health check failed"
              exit 1
            fi

            sleep 3
          done

          PUBLIC_VERSION="$(
            curl -fsS \
              --max-time 10 \
              "$BACKEND_URL/api/version"
          )"

          echo "$PUBLIC_VERSION"

          LIVE_SHA="$(
            printf '%s' "$PUBLIC_VERSION" |
            grep -o '"version":"[^"]*"' |
            cut -d'"' -f4
          )"

          if [ "$LIVE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Public API version mismatch"
            echo "Expected: $EXPECTED_SHA"
            echo "Actual:   $LIVE_SHA"
            exit 1
          fi

          echo "Public API deployment verified successfully."

  # ============================================================
  # Rollback
  # ============================================================
  rollback:
    needs: resolve-env

    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.force_rollback == true

    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-env.outputs.environment }}

    steps:
      - name: Configure SSH
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$DO_HOST"
          test -n "$DO_USER"
          test -n "$DO_SSH_KEY"

          mkdir -p ~/.ssh

          printf '%s\n' "$DO_SSH_KEY" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean

          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rollback application
        shell: bash
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/digitalocean \
            "$DO_USER@$DO_HOST" '
              set -euo pipefail

              APP_DIR="$HOME/pos/POS-server"

              cd "$APP_DIR"

              LATEST_BACKUP="$(
                ls -dt dist.backup-* 2>/dev/null |
                head -n 1 || true
              )"

              if [ -z "$LATEST_BACKUP" ]; then
                echo "::error::No application backup found"
                exit 1
              fi

              echo "Restoring: $LATEST_BACKUP"

              rm -rf dist.rollback

              if [ -d dist ]; then
                mv dist dist.rollback
              fi

              mv "$LATEST_BACKUP" dist

              corepack enable
              corepack prepare pnpm@9.15.9 --activate

              pnpm install --frozen-lockfile

              echo "::warning::Database migrations are NOT rolled back."
              echo "::warning::Rollback only restores application files."

              pm2 restart backend --update-env
              pm2 save

              echo "Application rollback completed."
            '

      - name: Verify rollback health
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -euo pipefail

          for i in $(seq 1 20); do

            if curl -fsS \
              --max-time 10 \
              "$BACKEND_URL/api/health"
              then

              echo "Rollback health check passed."

              curl -fsS \
                --max-time 10 \
                "$BACKEND_URL/api/version" || true

              exit 0
            fi

            sleep 3
          done

          echo "::error::Rollback health check failed"
          exit 1

  # ============================================================
  # Summary
  # ============================================================
  summary:
    needs:
      [
        resolve-env,
        test,
        lint,
        build,
        deploy,
        rollback
      ]

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: CI/CD Summary
        shell: bash
        run: |
          {
            echo "## Backend CI/CD Summary"
            echo ""
            echo "| Item | Result |"
            echo "|------|--------|"
            echo "| Environment | ${{ needs.resolve-env.outputs.environment }} |"
            echo "| Test | ${{ needs.test.result }} |"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Deploy | ${{ needs.deploy.result }} |"
            echo "| Rollback | ${{ needs.rollback.result }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Event | ${{ github.event_name }} |"
            echo "| Ref | ${{ github.ref }} |"
            echo ""
            echo "### Configuration"
            echo ""
            echo "| Secret | Configured |"
            echo "|--------|------------|"
            echo "| DO_HOST | ${{ secrets.DO_HOST != '' }} |"
            echo "| DO_USER | ${{ secrets.DO_USER != '' }} |"
            echo "| DO_SSH_KEY | ${{ secrets.DO_SSH_KEY != '' }} |"
            echo "| BACKEND_URL | ${{ secrets.BACKEND_URL != '' }} |"
            echo "| JWT_SECRET | ${{ secrets.JWT_SECRET != '' }} |"
            echo "| JWT_REFRESH_SECRET | ${{ secrets.JWT_REFRESH_SECRET != '' }} |"
            echo "| PLATFORM_BOOTSTRAP_TOKEN | ${{ secrets.PLATFORM_BOOTSTRAP_TOKEN != '' }} |"
            echo ""
            echo "### Toolchain"
            echo ""
            echo "| Tool | Version |"
            echo "|------|---------|"
            echo "| Node.js | ${{ env.NODE_VERSION }} |"
            echo "| pnpm | ${{ env.PNPM_VERSION }} |"
          } >> "$GITHUB_STEP_SUMMARY"
