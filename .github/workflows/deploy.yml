name: Deploy to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
        default: "staging"
      force_rollback:
        description: "Force rollback to previous version"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
  release:
    types: [published]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"

jobs:
  # ── Resolve deployment configuration from secrets ────────────────
  resolve-config:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      do_host: ${{ steps.env.outputs.do_host }}
      do_port: ${{ steps.env.outputs.do_port }}
      do_user: ${{ steps.env.outputs.do_user }}
      do_ssh_key: ${{ steps.env.outputs.do_ssh_key }}
      backend_url: ${{ steps.env.outputs.backend_url }}
      frontend_url: ${{ steps.env.outputs.frontend_url }}
      database_url: ${{ steps.env.outputs.database_url }}
      web_origin: ${{ steps.env.outputs.web_origin }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - name: Resolve configuration
        id: env
        run: |
          # Determine environment
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          else
            ENV="staging"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"

          case "$ENV" in
            production)
              echo "do_host=${{ secrets.DO_HOST }}" >> "$GITHUB_OUTPUT"
              echo "do_port=${{ secrets.DO_PORT }}" >> "$GITHUB_OUTPUT"
              echo "do_user=${{ secrets.DO_USER }}" >> "$GITHUB_OUTPUT"
              echo "do_ssh_key=${{ secrets.DO_SSH_KEY }}" >> "$GITHUB_OUTPUT"
              echo "backend_url=${{ secrets.BACKEND_URL }}" >> "$GITHUB_OUTPUT"
              echo "frontend_url=${{ secrets.FRONTEND_URL }}" >> "$GITHUB_OUTPUT"
              echo "database_url=${{ secrets.DATABASE_URL }}" >> "$GITHUB_OUTPUT"
              echo "web_origin=${{ secrets.WEB_ORIGIN }}" >> "$GITHUB_OUTPUT"
              echo "image_tag=latest" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "do_host=${{ secrets.DO_HOST_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "do_port=${{ secrets.DO_PORT }}" >> "$GITHUB_OUTPUT"
              echo "do_user=${{ secrets.DO_USER }}" >> "$GITHUB_OUTPUT"
              echo "do_ssh_key=${{ secrets.DO_SSH_KEY }}" >> "$GITHUB_OUTPUT"
              echo "backend_url=${{ secrets.BACKEND_URL_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "frontend_url=${{ secrets.FRONTEND_URL_STAGING }}" >> "$GITHUB_OUTPUT"
              echo "database_url=${{ secrets.DATABASE_URL }}" >> "$GITHUB_OUTPUT"
              echo "web_origin=${{ secrets.WEB_ORIGIN }}" >> "$GITHUB_OUTPUT"
              echo "image_tag=staging-${{ github.sha }}" >> "$GITHUB_OUTPUT"
              ;;
          esac

  # ── Verify rollback condition ────────────────────────────────────
  check-rollback:
    needs: [resolve-config]
    runs-on: ubuntu-latest
    if: github.event.inputs.force_rollback == true
    steps:
      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous version on ${{ needs.resolve-config.outputs.do_host }}"

  # ── Deploy Backend ───────────────────────────────────────────────
  deploy-backend:
    needs: [resolve-config]
    if: github.event.inputs.force_rollback == false
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Build backend
        run: |
          pnpm install
          node scripts/unlock-prisma-engine.mjs
          pnpm build
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: ${{ secrets.PORT || 4000 }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          ssh-keyscan -p ${{ secrets.DO_PORT }} ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy backend to droplet
        run: |
          ssh -p ${{ secrets.DO_PORT }} ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "cd ~/app/backend && \
             export NODE_ENV=production && \
             export PORT=${{ secrets.PORT || 4000 }} && \
             export WEB_ORIGIN=${{ secrets.WEB_ORIGIN }} && \
             export DATABASE_URL=${{ secrets.DATABASE_URL }} && \
             export JWT_SECRET=${{ secrets.JWT_SECRET }} && \
             export JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }} && \
             export PLATFORM_BOOTSTRAP_TOKEN=${{ secrets.PLATFORM_BOOTSTRAP_TOKEN }} && \
             export ALLOW_PLATFORM_BOOTSTRAP=${{ secrets.ALLOW_PLATFORM_BOOTSTRAP }} && \
             pnpm install --frozen-lockfile --prod && \
             pm2 restart backend --update-env || pm2 start dist/index.js --name backend --update-env"

      - name: Verify backend health
        run: |
          for i in 1 2 3 4 5; do
            sleep 3
            if curl -sf ${{ secrets.BACKEND_URL }}/api/health; then
              echo "✅ Backend healthy at ${{ secrets.BACKEND_URL }}"
              exit 0
            fi
          done
          echo "❌ Backend not healthy after 15s"
          exit 1

  # ── Deploy Frontend ─────────────────────────────────────────────
  deploy-frontend:
    needs: [resolve-config]
    if: github.event.inputs.force_rollback == false
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-config.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm install
          pnpm build
        working-directory: frontend
        env:
          NEXT_PUBLIC_APP_ENV: ${{ needs.resolve-config.outputs.environment }}
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}

      - name: Deploy frontend to droplet
        run: |
          ssh -p ${{ secrets.DO_PORT }} ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "cd ~/app/frontend && \
             export NEXT_PUBLIC_APP_ENV=${{ needs.resolve-config.outputs.environment }} && \
             export NEXT_PUBLIC_API_URL=${{ secrets.BACKEND_URL }} && \
             pnpm install --frozen-lockfile --prod && \
             pm2 restart frontend --update-env || pm2 start server.js --name frontend --update-env"

      - name: Verify frontend health
        run: |
          for i in 1 2 3 4 5; do
            sleep 3
            if curl -sf ${{ secrets.FRONTEND_URL }}/; then
              echo "✅ Frontend healthy at ${{ secrets.FRONTEND_URL }}"
              exit 0
            fi
          done
          echo "❌ Frontend not healthy after 15s"
          exit 1

  # ── Deploy via Docker Compose (alternative) ────────────────────
  deploy-docker:
    needs: [resolve-config, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.event.inputs.force_rollback == false
    environment: ${{ needs.resolve-config.outputs.environment }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/digitalocean
          chmod 600 ~/.ssh/digitalocean
          ssh-keyscan -p ${{ secrets.DO_PORT }} ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy via Docker Compose
        run: |
          ssh -p ${{ secrets.DO_PORT }} ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "cd ~/app && \
             docker compose pull && \
             docker compose up -d --remove-orphans && \
             docker image prune -af && \
             docker system prune -f && \
             echo 'Docker deployment complete on ${{ secrets.DO_HOST }}'"

  # ── Summary ────────────────────────────────────────────────────
  summary:
    needs: [resolve-config, deploy-backend, deploy-frontend, deploy-docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ needs.resolve-config.outputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host | ${{ secrets.DO_HOST }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend URL | ${{ secrets.BACKEND_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend URL | ${{ secrets.FRONTEND_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Tag | ${{ needs.resolve-config.outputs.image_tag }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend Status | ${{ needs.deploy-backend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Status | ${{ needs.deploy-frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docker Status | ${{ needs.deploy-docker.result }} |" >> "$GITHUB_STEP_SUMMARY"