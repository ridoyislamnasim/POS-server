name: Deploy Backend to DigitalOcean

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "backend/**"

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:

  # ── Rollback ────────────────────────────────────────────────────
  # Rollback can be added here later if needed.


  # ── Deploy Backend ──────────────────────────────────────────────
  deploy-backend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile


      - name: Build backend
        working-directory: backend
        run: |
          node scripts/unlock-prisma-engine.mjs
          pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORT: ${{ secrets.PORT }}
          WEB_ORIGIN: ${{ secrets.WEB_ORIGIN }}


      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean

          chmod 600 ~/.ssh/digitalocean

          ssh-keyscan \
            -p "${{ secrets.DO_PORT }}" \
            "${{ secrets.DO_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null


      - name: Upload backend to DigitalOcean
        shell: bash
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/digitalocean -p ${{ secrets.DO_PORT }}" \
            backend/ \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/app/backend/


      - name: Install production dependencies and restart backend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/digitalocean \
            -p "${{ secrets.DO_PORT }}" \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            "cd ~/app/backend && \
             pnpm install --frozen-lockfile --prod && \
             pm2 restart backend --update-env || \
             pm2 start dist/index.js --name backend --update-env && \
             pm2 save"


      - name: Verify backend health
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            sleep 3

            if curl -fsS "${{ secrets.BACKEND_URL }}/api/health"; then
              echo "Backend is healthy."
              exit 0
            fi
          done

          echo "Backend health check failed."
          exit 1


  # ── Summary ─────────────────────────────────────────────────────
  summary:
    needs:
      - deploy-backend

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Deployment summary
        run: |
          echo "## Backend Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host | ${{ secrets.DO_HOST }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend URL | ${{ secrets.BACKEND_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend Status | ${{ needs.deploy-backend.result }} |" >> "$GITHUB_STEP_SUMMARY"