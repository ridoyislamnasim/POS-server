name: Deploy Frontend to DigitalOcean

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "frontend/**"

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:

  # ── Rollback ────────────────────────────────────────────────────
  # Rollback can be added here later if needed.


  # ── Deploy Frontend ─────────────────────────────────────────────
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile


      - name: Build frontend
        working-directory: frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.BACKEND_URL }}


      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.DO_SSH_KEY }}' > ~/.ssh/digitalocean

          chmod 600 ~/.ssh/digitalocean

          ssh-keyscan \
            -p "${{ secrets.DO_PORT }}" \
            "${{ secrets.DO_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null


      - name: Upload frontend to DigitalOcean
        shell: bash
        run: |
          rsync -az --delete \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.git' \
            -e "ssh -i ~/.ssh/digitalocean -p ${{ secrets.DO_PORT }}" \
            frontend/ \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/app/frontend/


      - name: Install production dependencies and restart frontend
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/digitalocean \
            -p "${{ secrets.DO_PORT }}" \
            "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            "cd ~/app/frontend && \
             pnpm install --frozen-lockfile --prod && \
             pm2 restart frontend --update-env || \
             pm2 start server.js --name frontend --update-env && \
             pm2 save"


      - name: Verify frontend health
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            sleep 3

            if curl -fsS "${{ secrets.FRONTEND_URL }}/"; then
              echo "Frontend is healthy."
              exit 0
            fi
          done

          echo "Frontend health check failed."
          exit 1


  # ── Summary ─────────────────────────────────────────────────────
  summary:
    needs:
      - deploy-frontend

    runs-on: ubuntu-latest

    if: always()

    steps:

      - name: Deployment summary
        run: |
          echo "## Frontend Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | production |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Host | ${{ secrets.DO_HOST }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend URL | ${{ secrets.FRONTEND_URL }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Status | ${{ needs.deploy-frontend.result }} |" >> "$GITHUB_STEP_SUMMARY"