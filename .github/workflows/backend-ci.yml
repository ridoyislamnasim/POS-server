name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
    branches: [main, develop]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
    branches: [main, develop]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos123
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Unlock Prisma engine
        run: node scripts/unlock-prisma-engine.mjs
        working-directory: backend
        env:
          PORT: 4000

      - name: Prisma generate
        run: pnpm db:generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run tests
        run: pnpm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public
          WEB_ORIGIN: http://localhost:3020,https://shohojhisab.com,https://mobile.shohojhisab.com
          ALLOW_PLATFORM_BOOTSTRAP: 1
          PLATFORM_BOOTSTRAP_TOKEN: test-token-ci
          JWT_SECRET: test-jwt-secret-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-ci
          NODE_ENV: test

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: backend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: backend

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Unlock Prisma engine
        run: node scripts/unlock-prisma-engine.mjs
        working-directory: backend
        env:
          PORT: 4000

      - name: Prisma generate + TypeScript build
        run: pnpm build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pos:pos123@localhost:5432/pos?schema=public

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 5
